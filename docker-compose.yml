version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: hercare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hercare_user
      POSTGRES_PASSWORD: hercare_password
      POSTGRES_DB: hercare_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hercare_user -d hercare_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hercare-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://hercare_user:hercare_password@db:5432/hercare_db
      PORT: 8000
      ENV: development
      DEBUG: "True"
      AES_MASTER_KEY: ${AES_MASTER_KEY:-4a6f7966756c486572436172655365637572654b6579323032364861636b2121}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-hercare_jwt_super_secret_signing_key_hackathon_round2_2026}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      DEMO_MODE: "True"
      DEMO_OTP: "123456"
      GROQ_API_KEY: ${GROQ_API_KEY:-""}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-""}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-""}
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000","http://localhost:5173","http://127.0.0.1:5173"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hercare-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
